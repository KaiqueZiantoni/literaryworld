spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/literaryworld}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=15
refresh-token.expiration-days=30
google-books.api-key=${GOOGLE_BOOKS_API_KEY}

# --- Política de e-mail no cadastro ---------------------------------------
# Domínios que pulam a checagem de domínio. Porta de serviço de desenvolvimento,
# enquanto a verificação por link não existe. Deve ficar VAZIO em producao:
#   EMAIL_TRUSTED_DOMAINS=
literaryworld.email.trusted-domains=${EMAIL_TRUSTED_DOMAINS:teste.com}

# Resolvedores usados para consultar o MX. Vazio = configuracao do sistema.
# Apontar para servidores explicitos contorna resolv.conf mal configurado (o do
# sistema pode levar 12s para admitir um NXDOMAIN), ao custo de revelar a esses
# servidores o dominio de cada e-mail cadastrado.
literaryworld.email.dns-servers=${EMAIL_DNS_SERVERS:1.1.1.1,8.8.8.8}

literaryworld.email.dns-check-enabled=${EMAIL_DNS_CHECK:true}
literaryworld.email.dns-timeout-millis=1500

# --- Porta e limites de rede --------------------------------------------
# O Render injeta PORT; localmente cai para 8080.
server.port=${PORT:8080}

# Origens autorizadas a chamar a API. Aceita padrao, para cobrir os
# subdominios de preview da Vercel.
literaryworld.web.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Em producao: COOKIE_SECURE=true e COOKIE_SAME_SITE=None (exige HTTPS nos dois lados)
literaryworld.web.cookie-secure=${COOKIE_SECURE:false}
literaryworld.web.cookie-same-site=${COOKIE_SAME_SITE:Strict}
