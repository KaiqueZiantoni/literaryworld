services:
  postgres:
    image: postgres:16-alpine
    container_name: literaryworld-db
    environment:
      POSTGRES_DB: literaryworld
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
